





<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FishWorld</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

body{margin:0;background:#071521;color:white;font-family:Arial}

header{padding:20px;background:#102638;color:#42d6c4;font-size:26px;font-weight:bold}

main{padding:15px;max-width:700px;margin:auto}

button{background:#42d6c4;color:#071521;border:0;border-radius:10px;padding:14px;font-weight:bold;font-size:16px}

.publish{width:100%;margin:15px 0}

#map{height:300px;border-radius:12px}

.card{background:#102638;padding:15px;border-radius:12px;margin:12px 0}

input,select,textarea{display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0;background:#183247;color:white;border:1px solid #456;border-radius:8px}

img{max-width:100%;border-radius:10px}

#form{display:none}

nav{position:fixed;bottom:0;background:#102638;width:100%;display:flex;justify-content:space-around;padding:12px 0}

nav button{background:none;color:white;font-size:13px;padding:5px}

</style>

</head>

<body>

<header>🐟 FishWorld</header>

<main>

<h2>🌍 World Catch Map</h2>

<button class="publish" onclick="showForm()">＋ Publish a catch</button>

<div id="map"></div>

<div id="form" class="card">

<h2>🎣 Publish your catch</h2>

<input id="photo" type="file" accept="image/*">

<input id="species" placeholder="Fish species *">

<input id="weight" type="number" placeholder="Weight (kg)">

<input id="length" type="number" placeholder="Length (cm)">

<select id="country">

<option value="">Select country *</option>

<option>Australia</option><option>France</option>

<option>New Caledonia</option><option>United States</option>

<option>Japan</option><option>Brazil</option>

<option>Spain</option><option>Other</option>

</select>

<input id="area" placeholder="General area (optional)">

<select id="water">

<option>Saltwater</option><option>Freshwater</option><option>Brackish</option>

</select>

<input id="date" type="date">

<input id="technique" placeholder="Fishing technique">

<input id="bait" placeholder="Bait or lure">

<textarea id="story" placeholder="Tell your fishing story"></textarea>

<button class="publish" onclick="publishCatch()">🚀 Publish catch</button>

<button onclick="hideForm()">Cancel</button>

</div>

<h2>🌊 Latest catches</h2>

<div id="posts"></div>

</main>

<nav>

<button onclick="window.scrollTo(0,0)">🌍 Map</button>

<button onclick="document.getElementById('posts').scrollIntoView()">📰 Feed</button>

<button onclick="showForm()">＋ Publish</button>

</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let catches=[];

try{catches=JSON.parse(localStorage.getItem('fw-catches')||'[]')}catch(e){}

const map=L.map('map').setView([15,10],2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{

attribution:'© OpenStreetMap'

}).addTo(map);

const locations={

Australia:[-25,134],France:[46,2],

'New Caledonia':[-21,165],

'United States':[39,-98],Japan:[36,138],

Brazil:[-10,-52],Spain:[40,-4],Other:[0,0]

};

function showForm(){

document.getElementById('form').style.display='block';

document.getElementById('form').scrollIntoView({behavior:'smooth'});

}

function hideForm(){

document.getElementById('form').style.display='none';

}

function safe(s){

return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

}

function display(){

document.getElementById('posts').innerHTML=catches.map(c=>

`<div class="card"><h3>🐟 ${safe(c.species)}</h3>

<p>${safe(c.country)} · ${safe(c.date)}</p>

${c.photo?`<img src="${c.photo}">`:''}

<p>⚖️ ${safe(c.weight||'—')} kg · 📏 ${safe(c.length||'—')} cm</p>

<p>${safe(c.technique)} · ${safe(c.bait)}</p>

<p>${safe(c.story)}</p></div>`

).join('')||'<p>No catches yet. Be the first!</p>';

}

function addMarkers(){

catches.forEach(c=>{

if(c.lat!==undefined){

L.marker([c.lat,c.lon]).addTo(map)

.bindPopup(safe(c.species)+' · '+safe(c.country));

}

});

}

function publishCatch(){

const species=document.getElementById('species').value.trim();

const country=document.getElementById('country').value;

const date=document.getElementById('date').value;

if(!species||!country||!date){

alert('Please enter species, country and date.');

return;

}

const file=document.getElementById('photo').files[0];

const save=(photo)=>{

const coords=locations[country]||[0,0];

const c={

species,country,date,photo,

weight:document.getElementById('weight').value,

length:document.getElementById('length').value,

area:document.getElementById('area').value,

technique:document.getElementById('technique').value,

bait:document.getElementById('bait').value,

story:document.getElementById('story').value,

lat:coords[0]+(Math.random()-.5),

lon:coords[1]+(Math.random()-.5)

};

catches.unshift(c);

try{

localStorage.setItem('fw-catches',JSON.stringify(catches));

}catch(e){

catches.shift();

alert('Storage full. Try a smaller photo.');

return;

}

display();

addMarkers();

hideForm();

alert('Catch published on this device! 🐟');

};

if(file){

const reader=new FileReader();

reader.onload=()=>{

const img=new Image();

img.onload=()=>{

const canvas=document.createElement('canvas');

const scale=Math.min(1,900/Math.max(img.width,img.height));

canvas.width=img.width*scale;

canvas.height=img.height*scale;

canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);

save(canvas.toDataURL('image/jpeg',.7));

};

img.src=reader.result;

};

reader.readAsDataURL(file);

}else{save('');}

}

display();

addMarkers();

document.getElementById('date').value=new Date().toISOString().slice(0,10);

</script>

</body>

</html>
