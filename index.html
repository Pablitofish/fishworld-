



<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FishWorld</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{box-sizing:border-box}

body{margin:0;background:#071b26;color:white;font-family:Arial,sans-serif}

header{padding:19px;background:#103341;font-size:25px;font-weight:bold}

header span{color:#35d6b0}

main{padding:16px}

h1{font-size:25px;margin-bottom:7px}

p{color:#b5cbd3}

.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}

select{width:100%;padding:12px 5px;border-radius:10px;background:#174251;color:white;border:1px solid #416b78;font-size:13px}

#map{height:430px;border-radius:16px;overflow:hidden;border:1px solid #416b78}

h2{margin-top:25px}

.catch{background:#123542;padding:15px;border-radius:12px;margin:10px 0}

small{color:#35d6b0}

nav{position:sticky;bottom:0;background:#103341;display:flex;justify-content:space-around;padding:17px 3px}

nav a{color:white;text-decoration:none;font-size:12px}

.leaflet-popup-content-wrapper{border-radius:12px}

.leaflet-popup-content{color:#102b35;font-weight:bold}

</style>

</head>

<body>

<header>🐟 Fish<span>World</span></header>

<main>

<h1>Discover catches worldwide</h1>

<p>One world. One community. A passion for fishing.</p>

<div class="filters">

<select id="water">

<option value="all">All waters</option>

<option value="saltwater">Saltwater</option>

<option value="freshwater">Freshwater</option>

<option value="brackish">Brackish</option>

</select>

<select id="species">

<option value="all">All species</option>

<option value="Giant Trevally">Giant Trevally</option>

<option value="European Pike">European Pike</option>

<option value="Yellowfin Tuna">Yellowfin Tuna</option>

</select>

<select id="time">

<option value="all">All time</option>

<option value="7">Last 7 days</option>

<option value="30">Last 30 days</option>

<option value="365">Last 12 months</option>

</select>

<select id="type">

<option value="all">All catches</option>

<option value="demo">Demo catches</option>

<option value="verified">Verified catches</option>

</select>

</div>

<div id="map"></div>

<h2>Community catches</h2>

<div id="feed"></div>

</main>

<nav>

<a href="#map">🌍 Map</a>

<a href="#feed">🐟 Feed</a>

<a href="#publish">➕ Publish</a>

<a href="#profile">👤 Profile</a>

</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const catches=[

{name:"Giant Trevally",country:"Australia",water:"saltwater",lat:-19.25,lng:146.82,date:"2026-11-05",type:"demo",weight:"18 kg"},

{name:"European Pike",country:"France",water:"freshwater",lat:43.85,lng:4.35,date:"2026-10-25",type:"demo",weight:"8 kg"},

{name:"Yellowfin Tuna",country:"Pacific Ocean",water:"saltwater",lat:-17.5,lng:177.5,date:"2026-09-20",type:"demo",weight:"32 kg"}

];

const map=L.map('map').setView([15,10],2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{

maxZoom:18,

attribution:'&copy; OpenStreetMap contributors'

}).addTo(map);

const markers=L.layerGroup().addTo(map);

function update(){

markers.clearLayers();

const water=document.getElementById('water').value;

const species=document.getElementById('species').value;

const time=document.getElementById('time').value;

const type=document.getElementById('type').value;

const filtered=catches.filter(c=>{

const age=(Date.now()-new Date(c.date).getTime())/86400000;

return (water==='all'||c.water===water)

&&(species==='all'||c.name===species)

&&(time==='all'||age<=Number(time))

&&(type==='all'||c.type===type);

});

document.getElementById('feed').innerHTML=filtered.map(c=>

`<div class="catch"><small>DEMO CATCH · ${c.country.toUpperCase()}</small><h3>🐟 ${c.name}</h3><p>${c.weight} · ${c.country}</p></div>`

).join('')||'<p>No catches found with these filters.</p>';

filtered.forEach(c=>{

L.marker([c.lat,c.lng]).addTo(markers)

.bindPopup(`<b>${c.name}</b><br>${c.country}<br>${c.weight}<br>Demo catch`);

});

}

['water','species','time','type'].forEach(id=>{

document.getElementById(id).addEventListener('change',update);

});

update();

</script>

</body>

</html>
