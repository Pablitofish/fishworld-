







<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FishWorld</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{box-sizing:border-box}

body{margin:0;background:#071521;color:white;font-family:Arial,sans-serif}

header{padding:18px;background:#102638;color:#42d6c4;font-size:26px;font-weight:bold}

main{padding:15px;max-width:800px;margin:auto;padding-bottom:80px}

h2{font-size:20px}

.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}

input,select,textarea{width:100%;padding:12px;margin:5px 0 10px;background:#183247;color:white;border:1px solid #456;border-radius:8px;font-size:14px}

button{background:#42d6c4;color:#071521;border:0;border-radius:10px;padding:14px;font-weight:bold;font-size:15px}

.publish{width:100%;margin:14px 0}

#map{height:320px;border-radius:12px}

.card{background:#102638;padding:14px;border-radius:12px;margin:12px 0}

.card img{width:100%;max-height:260px;object-fit:cover;border-radius:10px}

label{font-size:12px;color:#a9c3d2}

.muted{font-size:12px;color:#a9c3d2}

#form{display:none}

nav{position:fixed;bottom:0;left:0;right:0;background:#102638;display:flex;justify-content:space-around;padding:10px;z-index:1000}

nav button{background:none;color:white;padding:8px;font-size:13px}

</style>

</head>

<body>

<header>🐟 FishWorld <span style="font-size:12px">GLOBAL FISHING COMMUNITY</span></header>

<main>

<h2>🌍 World Catch Map</h2>

<div class="filters">

<select id="waterFilter" onchange="render()">

<option value="">All waters</option>

<option>Saltwater</option><option>Freshwater</option><option>Brackish</option>

</select>

<select id="speciesFilter" onchange="render()">

<option value="">All species</option>

<option>Giant Trevally</option><option>European Pike</option>

<option>Yellowfin Tuna</option><option>Queenfish</option>

</select>

<select id="timeFilter" onchange="render()">

<option value="">All time</option>

<option value="7">Last 7 days</option>

<option value="30">Last 30 days</option>

<option value="365">Last 12 months</option>

</select>

<select id="typeFilter" onchange="render()">

<option value="">All catches</option>

<option>Demo</option><option>Community</option>

</select>

</div>

<div id="map"></div>

<button class="publish" onclick="showForm()">＋ Publish a catch</button>

<section id="form" class="card">

<h2>🎣 Publish your catch</h2>

<label>Catch photo</label>

<input id="photo" type="file" accept="image/*">

<label>Fish species *</label>

<input id="species" placeholder="e.g. Queenfish">

<label>Weight (kg)</label>

<input id="weight" type="number" step="0.1" placeholder="e.g. 8">

<label>Length (cm)</label>

<input id="length" type="number" placeholder="e.g. 100">

<label>Country *</label>

<select id="country">

<option value="">Select country</option>

<option>Australia</option><option>France</option>

<option>New Caledonia</option><option>United States</option>

<option>Japan</option><option>Brazil</option>

<option>Spain</option><option>South Africa</option>

<option>Indonesia</option><option>Other</option>

</select>

<label>City or region *</label>

<input id="area" placeholder="e.g. Townsville, Queensland">

<p class="muted">Use a general area, never an exact secret fishing spot.</p>

<label>Water type</label>

<select id="water"><option>Saltwater</option><option>Freshwater</option><option>Brackish</option></select>

<label>Catch date</label>

<input id="date" type="date">

<label>Fishing technique</label>

<input id="technique" placeholder="e.g. Casting, popping, jigging">

<label>Bait or lure</label>

<input id="bait" placeholder="e.g. Stickbait, live bait">

<label>Your story</label>

<textarea id="story" rows="3" placeholder="Tell us about your catch..."></textarea>

<button class="publish" onclick="publishCatch()">🚀 Publish catch</button>

<button onclick="hideForm()" style="background:#345064;color:white">Cancel</button>

</section>

<h2>🌊 Latest catches</h2>

<div id="posts"></div>

</main>

<nav>

<button onclick="goMap()">🌍 Map</button>

<button onclick="goFeed()">📰 Feed</button>

<button onclick="showForm()">＋ Publish</button>

</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const demos=[

{id:1,species:"Giant Trevally",country:"Australia",area:"Queensland",water:"Saltwater",weight:18,length:110,date:"2026-11-05",type:"Demo",lat:-18,lon:147,story:"A powerful fish!"},

{id:2,species:"European Pike",country:"France",area:"Southern France",water:"Freshwater",weight:7,length:95,date:"2026-10-25",type:"Demo",lat:43.8,lon:4.3,story:"Beautiful freshwater predator."},

{id:3,species:"Yellowfin Tuna",country:"New Caledonia",area:"Pacific Ocean",water:"Saltwater",weight:35,length:125,date:"2026-09-20",type:"Demo",lat:-21,lon:165,story:"An amazing fight!"}

];

let catches=[];

try{catches=JSON.parse(localStorage.getItem("fw-catches")||"[]")}catch(e){catches=[]}

const locations={

"townsville":[-19.26,146.82],

"queensland":[-20.9,147.7],

"cairns":[-16.92,145.77],

"brisbane":[-27.47,153.03],

"sydney":[-33.87,151.21],

"melbourne":[-37.81,144.96],

"perth":[-31.95,115.86],

"darwin":[-12.46,130.84],

"adelaide":[-34.93,138.60],

"nimes":[43.84,4.36],

"marseille":[43.30,5.37],

"paris":[48.86,2.35],

"noumea":[-22.26,166.46],

"new caledonia":[-21.5,165.5],

"tokyo":[35.68,139.69],

"los angeles":[34.05,-118.24],

"new york":[40.71,-74.01],

"rio de janeiro":[-22.91,-43.17],

"barcelona":[41.39,2.17],

"cape town":[-33.92,18.42],

"bali":[-8.65,115.22],

"jakarta":[-6.21,106.85]

};

const countryCenters={

Australia:[-25,134],France:[46,2],"New Caledonia":[-21.5,165.5],

"United States":[39,-98],Japan:[36,138],Brazil:[-10,-52],

Spain:[40,-4],"South Africa":[-29,24],Indonesia:[-2,118],Other:[0,0]

};

function getLocation(area,country){

const key=area.trim().toLowerCase();

if(locations[key])return locations[key];

for(const name in locations){

if(key.includes(name))return locations[name];

}

return countryCenters[country]||[0,0];

}

const map=L.map("map").setView([15,10],2);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{

attribution:"© OpenStreetMap contributors"

}).addTo(map);

let markers=[];

function allCatches(){return [...catches,...demos]}

function filtered(){

let list=allCatches();

const water=document.getElementById("waterFilter").value;

const species=document.getElementById("speciesFilter").value;

const type=document.getElementById("typeFilter").value;

const days=document.getElementById("timeFilter").value;

if(water)list=list.filter(c=>c.water===water);

if(species)list=list.filter(c=>c.species===species);

if(type)list=list.filter(c=>c.type===type);

if(days){

const limit=Date.now()-Number(days)*86400000;

list=list.filter(c=>new Date(c.date+"T23:59:59").getTime()>=limit);

}

return list;

}

function safe(s){

return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

}

function render(){

markers.forEach(m=>map.removeLayer(m));

markers=[];

const list=filtered();

list.forEach(c=>{

if(typeof c.lat!=="number"||typeof c.lon!=="number")return;

const m=L.marker([c.lat,c.lon]).addTo(map);

m.bindPopup("<b>"+safe(c.species)+"</b><br>"+safe(c.country)+"<br>"+(c.weight||"—")+" kg");

markers.push(m);

});

document.getElementById("posts").innerHTML=list.map(c=>`

<article class="card">

<b>🐟 ${safe(c.species)}</b>

<p class="muted">${safe(c.area||c.country)} · ${safe(c.date)} · ${c.type==="Demo"?"Demo catch":"Community catch"}</p>

${c.photo?'<img src="'+c.photo+'" alt="Catch photo">':''}

<p>⚖️ ${safe(c.weight||"—")} kg · 📏 ${safe(c.length||"—")} cm</p>

<p class="muted">${safe(c.water)} · ${safe(c.technique||"")} · ${safe(c.bait||"")}</p>

<p>${safe(c.story||"")}</p>

</article>`).join("")||'<p class="muted">No catches found.</p>';

}

function showForm(){

document.getElementById("form").style.display="block";

document.getElementById("form").scrollIntoView({behavior:"smooth"});

}

function hideForm(){document.getElementById("form").style.display="none"}

function goMap(){document.getElementById("map").scrollIntoView({behavior:"smooth"});setTimeout(()=>map.invalidateSize(),300)}

function goFeed(){document.getElementById("posts").scrollIntoView({behavior:"smooth"})}

function publishCatch(){

const species=document.getElementById("species").value.trim();

const country=document.getElementById("country").value;

const date=document.getElementById("date").value;

const area=document.getElementById("area").value.trim();

if(!species||!country||!date||!area){

alert("Please enter species, country, city or region, and date.");

return;

}

const file=document.getElementById("photo").files[0];

const save=photo=>{

const coords=getLocation(area,country);

const c={

id:Date.now(),species,country,area,date,photo,

water:document.getElementById("water").value,

weight:document.getElementById("weight").value,

length:document.getElementById("length").value,

technique:document.getElementById("technique").value,

bait:document.getElementById("bait").value,

story:document.getElementById("story").value,

type:"Community",

lat:coords[0]+(Math.random()-.5)*.15,

lon:coords[1]+(Math.random()-.5)*.15

};

const updated=[c,...catches];

try{localStorage.setItem("fw-catches",JSON.stringify(updated));catches=updated}

catch(e){alert("Storage full. Try a smaller photo.");return}

render();

hideForm();

document.getElementById("form").querySelectorAll("input,textarea").forEach(x=>{if(x.type!=="date"&&x.type!=="file")x.value=""});

document.getElementById("photo").value="";

document.getElementById("date").value=new Date().toISOString().slice(0,10);

alert("Your catch has been published! 🐟");

goFeed();

};

if(file){

if(!file.type.startsWith("image/")){alert("Please choose an image.");return}

const reader=new FileReader();

reader.onload=()=>{

const img=new Image();

img.onload=()=>{

const canvas=document.createElement("canvas");

const scale=Math.min(1,900/Math.max(img.width,img.height));

canvas.width=img.width*scale;

canvas.height=img.height*scale;

canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);

save(canvas.toDataURL("image/jpeg",.7));

};

img.onerror=()=>alert("Could not load the photo.");

img.src=reader.result;

};

reader.readAsDataURL(file);

}else{save("")}

}

document.getElementById("date").value=new Date().toISOString().slice(0,10);

render();

</script>

</body>

</html>
